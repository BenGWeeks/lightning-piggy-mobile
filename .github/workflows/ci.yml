name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  # Manual runs always include the native jobs (see the `changes` job).
  workflow_dispatch:

# A new push to a PR cancels its older in-flight run (frees macOS runners).
# Runs on main / manual runs are keyed by run_id, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Keep native check names stable; skipped jobs still report a merge signal.
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            native:
              - 'package.json'
              - 'package-lock.json'
              - 'app.config.ts'
              - 'app.json'
              - 'eas.json'
              - 'plugins/**'
              - 'android/**'
              - 'ios/**'
              - 'modules/**'
              - 'patches/**'
              - 'metro.config.js'
              - 'babel.config.js'
              - '.github/workflows/ci.yml'

  bundle:
    name: Metro bundle
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx expo export --platform android --dev --output-dir /tmp/bundle

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  file-size:
    name: File size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/check-file-size.sh

  perf-antipatterns:
    name: Perf anti-patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/check-perf-antipatterns.sh

  native-sdk-tests:
    name: Native SDK artifact tests
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: >-
          node --test scripts/native-sdk-manifest.test.mjs scripts/download-sdk-artifact.test.mjs
          scripts/fetch-nostr-sdk-swift.test.mjs scripts/check-elf-alignment.test.mjs

  android-native-alignment:
    name: Android APK 16 KB alignment
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android alignment tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Install dependencies
        run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Check prebuild kept the committed dependency set
        run: git diff --exit-code -- package.json package-lock.json
      - name: Build Preview APK with both 64-bit architectures
        working-directory: android
        # The generated default heap (2 GiB) intermittently OOMs in
        # :app:packageRelease now the APK is ~300 MB (#1130); runners have 16 GB.
        run: >-
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"
      - name: Verify APK ELF and ZIP alignment
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          bash scripts/check-elf-alignment.sh "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"

  ios-engine-lifecycle:
    name: iOS engine lifecycle
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile production actor with SDK test doubles
        run: >-
          swiftc -swift-version 5 -parse-as-library
          scripts/ios-tests/NostrEngineFixtures.swift
          modules/nostr-native/ios/NostrEngine.swift
          scripts/ios-tests/NostrEngineLifecycle.swift
          -o "$RUNNER_TEMP/nostr-engine-lifecycle"
      - name: Exercise disposal and restart races
        run: '"$RUNNER_TEMP/nostr-engine-lifecycle"'

  # The lifecycle job above compiles against hand-written SDK doubles; this
  # one compiles modules/nostr-native against the real checksum-pinned
  # rust-nostr 0.44.2 artifacts and the installed ExpoModulesCore, and links
  # the full app for the iOS Simulator. Gated by the `changes` job (job-level
  # `if`, never a workflow `on.paths` filter) so that, if it is ever made a
  # required check, a skipped run still reports and doesn't block merge.
  ios-native-build:
    name: iOS native pod build
    needs: changes
    if: >-
      needs.changes.outputs.native == 'true' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Pinned to the Xcode release docs/TROUBLESHOOTING.adoc validates
      # (RN 0.83.6 prebuilt core links clean on 26.5).
      XCODE_VERSION: '26.5'
      APP_VARIANT: development
      # Hard-fail npm ci's postinstall if the pinned Swift SDK can't be
      # fetched + verified, instead of the JS-only "continue without" path.
      FETCH_NOSTR_SDK_SWIFT_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: |
          xcode="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner image"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          pod --version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (fetches rust-nostr Swift SDK via postinstall)
        run: npm ci
      - name: Verify pinned Swift SDK artifacts
        run: |
          marker=modules/nostr-native/ios/nostr_sdkFFI.xcframework/.lightning-piggy-version
          test -f modules/nostr-native/ios/Generated/NostrSDK.swift
          grep -q '^0\.44\.2 ' "$marker" || { echo "::error::unexpected SDK marker: $(cat "$marker")"; exit 1; }
          # Re-runs the checksum + content-manifest checks on what's on disk;
          # a re-download here would mean postinstall left unverified files.
          out=$(node scripts/fetch-nostr-sdk-swift.mjs)
          echo "$out"
          grep -q 'already present' <<<"$out"
      - name: Expo prebuild + pod install
        run: npx expo prebuild --platform ios
      - name: Check prebuild kept the committed dependency set
        # prebuild may rewrite package.json deps from its template and
        # reinstall; the build below must test exactly what's committed.
        run: git diff --exit-code -- package.json package-lock.json
      - name: Check NostrNative pod integration
        run: grep -q 'NostrNative (0\.44\.2)' ios/Podfile.lock
      - name: Build app for iOS Simulator
        run: |
          workspace=$(ls -d ios/*.xcworkspace)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Check rust-nostr FFI symbols were linked
        run: |
          app=$(ls -d "$RUNNER_TEMP"/DerivedData/Build/Products/Debug-iphonesimulator/*.app)
          name=$(basename "$app" .app)
          # Xcode's Debug builds may move app code into <name>.debug.dylib.
          count=0
          for bin in "$app/$name" "$app/$name.debug.dylib"; do
            [ -f "$bin" ] || continue
            n=$(nm -U "$bin" | grep -c 'uniffi_nostr_sdk_ffi_' || true)
            echo "$bin: $n uniffi_nostr_sdk_ffi_ symbols"
            count=$((count + n))
          done
          [ "$count" -gt 0 ] || { echo "::error::rust-nostr FFI not linked into $name"; exit 1; }
