name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  file-size:
    name: File size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-file-size.sh

  perf-antipatterns:
    name: Perf anti-patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-perf-antipatterns.sh

  native-sdk-tests:
    name: Native SDK artifact tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/native-sdk-manifest.test.mjs scripts/download-sdk-artifact.test.mjs

  ios-engine-lifecycle:
    name: iOS engine lifecycle
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile production actor with SDK test doubles
        run: >-
          swiftc -swift-version 5 -parse-as-library
          scripts/ios-tests/NostrEngineFixtures.swift
          modules/nostr-native/ios/NostrEngine.swift
          scripts/ios-tests/NostrEngineLifecycle.swift
          -o "$RUNNER_TEMP/nostr-engine-lifecycle"
      - name: Exercise disposal and restart races
        run: '"$RUNNER_TEMP/nostr-engine-lifecycle"'
