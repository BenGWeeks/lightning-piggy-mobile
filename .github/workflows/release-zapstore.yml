name: Release Zapstore

# Publishes each stable GitHub Release to Zapstore (#1517): zsp fetches the
# release's production APK, uploads it with the icon and screenshots to
# Zapstore's Blossom CDN, and publishes the kind 32267 app, 30063 release and
# 3063 asset events, signed over NIP-46 by the Lightning Piggy team account.
# Separate from release.yml so a Zapstore or bunker failure never blocks a
# release. Process and one-time pairing: docs/DEPLOYMENT.adoc → "Zapstore".

on:
  # Wait until Release has attached the APK.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.5.2)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-zapstore-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  # Pinned zsp release; update both together. The digest is GitHub's asset
  # digest for zsp-<version>-linux-amd64.
  ZSP_VERSION: '0.4.17'
  ZSP_SHA256: '3f241da6a5dc7a85fe851d3b42b77790b651bd36c7029382a701262bda832d20'

jobs:
  publish:
    # A failed Release run (e.g. only iOS failed) may still have attached the
    # APK; the resolve step checks for the asset itself.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'release' &&
       contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="$MANUAL_TAG"
          if [ -z "$tag" ]; then
            tag="$RUN_BRANCH"
            # Release runs normally name the tag; some payloads name the branch.
            if [ -z "$tag" ] || ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName >/dev/null 2>&1; then
              tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
            fi
          fi
          skip() {
            # A manual run that can't publish is an error; an automatic one is a notice.
            if [ -n "$MANUAL_TAG" ]; then echo "::error::$1"; exit 1; fi
            echo "::notice::Zapstore publish skipped: $1"
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Stable X.Y.Z tags only: Zapstore's main channel carries stable releases,
          # and the tag becomes a release_filter regex below.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            skip 'the release tag is not a stable vX.Y.Z tag.'
          fi
          if ! info=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft,assets); then
            skip "no GitHub Release for $tag."
          fi
          if [ "$(jq -r '.isPrerelease or .isDraft' <<< "$info")" = true ]; then
            skip "$tag is a draft or prerelease."
          fi
          if ! jq -e --arg apk "lightning-piggy-$tag.apk" '.assets | any(.name == $apk)' <<< "$info" >/dev/null; then
            skip "$tag has no lightning-piggy-$tag.apk attached (did the Android build or attach job fail?)."
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Check secrets
        if: steps.release.outputs.enabled == 'true'
        id: secrets
        env:
          ZAPSTORE_BUNKER_URI: ${{ secrets.ZAPSTORE_BUNKER_URI }}
          ZAPSTORE_CLIENT_KEY: ${{ secrets.ZAPSTORE_CLIENT_KEY }}
        run: |
          if [ -z "$ZAPSTORE_BUNKER_URI" ] || [ -z "$ZAPSTORE_CLIENT_KEY" ]; then
            echo '::notice::Zapstore publish skipped: configure ZAPSTORE_BUNKER_URI and ZAPSTORE_CLIENT_KEY (docs/DEPLOYMENT.adoc → Zapstore).'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      # Automation and zapstore.yaml come from trusted main, never from the tag.
      - name: Checkout automation
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (no native builds)
        if: steps.secrets.outputs.enabled == 'true'
        # Only nostr-tools is needed, for the signer pre-flight.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install zsp ${{ env.ZSP_VERSION }}
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/bin/zsp" \
            "https://github.com/zapstore/zsp/releases/download/v${ZSP_VERSION}/zsp-${ZSP_VERSION}-linux-amd64"
          echo "${ZSP_SHA256}  $RUNNER_TEMP/bin/zsp" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/zsp"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Pin the release tag
        if: steps.secrets.outputs.enabled == 'true'
        # zsp publishes the latest GitHub Release unless release_filter narrows it.
        # The copy stays at the repo root so the icon and screenshot paths resolve.
        run: |
          cp zapstore.yaml .zapstore-ci.yaml
          printf "\nrelease_filter: '^%s\$'\n" "${TAG//./\\.}" >> .zapstore-ci.yaml
          tail -n 1 .zapstore-ci.yaml

      - name: Check the APK zsp would publish
        if: steps.secrets.outputs.enabled == 'true'
        # Read-only: fetches and parses the release APK. No signer, relay or CDN.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: zsp publish --check --no-color .zapstore-ci.yaml

      - name: Pair client key and verify the signer account
        if: steps.secrets.outputs.enabled == 'true'
        # Richard approves the connection on his phone; allow 30 minutes.
        timeout-minutes: 32
        env:
          ZAPSTORE_BUNKER_URI: ${{ secrets.ZAPSTORE_BUNKER_URI }}
          ZAPSTORE_CLIENT_KEY: ${{ secrets.ZAPSTORE_CLIENT_KEY }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/zsp-config
        run: node scripts/zapstore-signer-preflight.mjs

      - name: Publish to Zapstore
        if: steps.secrets.outputs.enabled == 'true'
        # Includes the ~300 MB APK upload. zsp waits only 30 s for each Blossom
        # upload signature (kind 24242), so the bunker must auto-approve the
        # Zapstore kinds; see docs/DEPLOYMENT.adoc.
        timeout-minutes: 30
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/zsp-config
          GITHUB_TOKEN: ${{ github.token }}
        # SIGN_WITH comes from the pre-flight via GITHUB_ENV, without the
        # one-time pairing secret. The stable client key is already authorised.
        run: zsp publish --quiet --skip-metadata --no-color .zapstore-ci.yaml

      - name: Summary
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          {
            echo "## Zapstore: Lightning Piggy $TAG"
            echo ""
            echo "- Listing: https://zapstore.dev/apps/com.lightningpiggy.app"
          } >> "$GITHUB_STEP_SUMMARY"
