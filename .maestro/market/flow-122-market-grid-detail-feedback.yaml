appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Market — grid → product detail → reviews/comments tabs (#948)
---
# Flow: Explore → Market rail "See all" → full Market grid → open a product
# → assert the product detail (price + buy) → switch the Reviews / Comments
# feedback tabs.
#
# Verifies:
#   - The Explore "Market" rail "See all →" opens the full Market screen grid
#     (`market-screen`, with `market-product-card-<id>` tiles).
#   - Tapping a product tile pushes the product detail
#     (`market-product-detail-screen`) with a price (`market-price-primary`) and a buy
#     affordance (`-buy`).
#   - The Reviews / Comments feedback tabs render and switch: the Reviews
#     body (`product-reviews`) is shown first; tapping the Comments tab
#     mounts and shows the Comments body (`product-comments`); switching
#     back restores the Reviews body.
#
# Notes:
#   - We open `robotechy-lightning-piggy` specifically: Robotechy is one of
#     the sellers WITH a Nostr identity, so the review (kind 31555) /
#     comment (kind 1111) tabs render for it. It is also `featured: true`,
#     so featured-first ordering places it as the first grid tile.
#   - No sign-in is needed: the catalogue + feedback reads are anonymous;
#     compose is gated separately and not exercised here.
#   - Selectors are testID / text only — never coordinates (CLAUDE.md).

- launchApp:
    permissions:
      location: allow

- waitForAnimationToEnd:
    timeout: 10000

# Land on the Explore hub.
- tapOn:
    id: 'tab-explore'
- waitForAnimationToEnd:
    timeout: 1500

# "See all →" on the Market rail opens the full Market screen (grid).
- tapOn:
    id: 'explore-card-market'
- waitForAnimationToEnd:
    timeout: 2000

# Grid is up, with product tiles.
- assertVisible:
    id: 'market-screen'
- assertVisible:
    id: 'market-product-card-robotechy-lightning-piggy'

# Search expands within the patterned header and closes with a cleared query.
- assertNotVisible:
    id: 'market-search-input'
- tapOn:
    id: 'market-header-search'
- assertVisible:
    id: 'market-search-input'
- tapOn:
    id: 'market-search-input'
- inputText: 'piggy'
- tapOn:
    id: 'market-search-clear'
- assertNotVisible:
    id: 'market-search-input'

# The profile menu links to buying and selling from every tab.
- tapOn:
    id: 'profile-icon'
- assertVisible:
    id: 'account-menu-shop'
- assertVisible:
    id: 'account-menu-orders'
# Buyer's order history replaces the standalone receipt icon.
- tapOn:
    id: 'account-menu-orders'
- extendedWaitUntil:
    visible:
      id: 'my-orders-screen'
    timeout: 10000
- tapOn:
    id: 'my-orders-back'
- extendedWaitUntil:
    visible:
      id: 'market-screen'
    timeout: 10000
# Liked listings are directly accessible from the shortcut row.
- tapOn:
    id: 'market-shortcut-liked'
- assertVisible:
    id: 'market-liked-items-screen'
- tapOn:
    id: 'market-liked-items-back'

# The default preferred-sellers scope narrows the list, so the filter button
# is already active with one filter.
- assertVisible:
    id: 'market-filter-active-count'
    text: '1'

# Seller scope is selected in Filters; the compact chip resets it (#1362).
- tapOn:
    id: 'market-filter-button'
- waitForAnimationToEnd
- assertVisible:
    id: 'market-filter-sellers-preferred'
- assertVisible:
    id: 'market-scope-fof'
# Ships to (replaced Country): chips come from sellers' published shipping
# options; Worldwide is always offered and is the default selection.
- assertVisible:
    id: 'market-filter-shipsto-anywhere'
- assertNotVisible:
    id: 'market-filter-countries'
- tapOn:
    id: 'market-filter-sellers-friends'
- tapOn:
    id: 'market-filter-done'
- waitForAnimationToEnd
- assertVisible:
    id: 'market-filter-badge'
# The Friends scope pill carries the × that returns to Preferred.
- tapOn:
    id: 'market-scope-pill-friends'
- assertNotVisible:
    id: 'market-scope-pill-friends'
# Back on preferred sellers: shown as its own pill (no ×), and still one
# (scope) filter, not zero. The old status row / Refresh link is gone.
- assertVisible:
    id: 'market-scope-pill-preferred'
- assertNotVisible:
    id: 'market-live-refresh'
- assertVisible:
    id: 'market-filter-active-count'
    text: '1'
- assertVisible:
    id: 'market-product-card-robotechy-lightning-piggy'

# Open the product → its detail page.
- tapOn:
    id: 'market-product-card-robotechy-lightning-piggy'
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: 'market-product-detail-screen'
- assertVisible:
    id: 'market-price-primary'
# Buy shows for curated products and in-app-checkout listings; plain Nostr
# listings rely on Message seller (the njump "Open listing" button is gone).
- assertVisible:
    id: '(market-product-detail-buy|market-contact-seller)'

# Multi-image listings show a paged gallery (#1531); tapping an image opens
# the full-screen viewer as a swipeable gallery. Curated products have one
# image (no gallery), so this only runs when a gallery is present.
- runFlow:
    when:
      visible:
        id: 'market-product-gallery'
    commands:
      - assertVisible:
          id: 'market-product-gallery-dot-0'
      - assertVisible:
          id: 'market-product-gallery-dot-1'
      - tapOn:
          id: 'market-product-gallery-image-0'
      - waitForAnimationToEnd:
          timeout: 1500
      - assertVisible:
          id: 'fullscreen-image-gallery'
      - assertVisible:
          id: 'fullscreen-image-counter'
          text: '1 / .*'
      - tapOn:
          id: 'fullscreen-image-close'
      - waitForAnimationToEnd:
          timeout: 1000
      - assertVisible:
          id: 'market-product-detail-screen'

# Reviews + comments live below the fold — scroll the detail until the
# feedback tabs come into view.
- scrollUntilVisible:
    element:
      id: 'product-feedback-tabs'
    direction: DOWN
    timeout: 6000

- assertVisible:
    id: 'product-feedback-tab-reviews'
- assertVisible:
    id: 'product-feedback-tab-comments'

# Reviews is the default tab — its body is mounted and shown.
- assertVisible:
    id: 'product-reviews'

# Switch to Comments — the comments body is lazily mounted on first open.
- tapOn:
    id: 'product-feedback-tab-comments'
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: 'product-comments'

# Switch back to Reviews — both tabs stay mounted, so the reviews body
# is shown again with no refetch.
- tapOn:
    id: 'product-feedback-tab-reviews'
- waitForAnimationToEnd:
    timeout: 500
- assertVisible:
    id: 'product-reviews'

# Back to the grid so any chained flow leaves the app on the Market screen.
- tapOn:
    id: 'market-product-detail-back'
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible:
    id: 'market-screen'
