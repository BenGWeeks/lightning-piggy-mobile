appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Shop settings — first-item actions (#1370)
env:
  HAS_LISTINGS: ${HAS_LISTINGS || 'false'}
---
# Run signed in with a known seller fixture. Default: no listings (with or
# without a shop). Repeat with -e HAS_LISTINGS=true for a shop with listings.
# Read-only: does not save settings or publish products to real relays.
# Successful saves and publication destinations are covered by unit tests.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'tab-explore'
    timeout: 60000
- tapOn:
    id: 'tab-explore'
- extendedWaitUntil:
    visible:
      id: 'explore-card-market'
    timeout: 15000
- tapOn:
    id: 'explore-card-market'
- extendedWaitUntil:
    visible:
      id: 'market-my-shop-button'
    timeout: 15000
- tapOn:
    id: 'market-my-shop-button'
- extendedWaitUntil:
    visible:
      id: 'my-shop-(edit|setup)'
    timeout: 30000
- tapOn:
    id: 'my-shop-(edit|setup)'
- extendedWaitUntil:
    visible:
      id: 'shop-name-input'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'shop-save(-and-add-item)?'
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      true: ${HAS_LISTINGS !== 'true'}
    commands:
      - assertVisible:
          id: 'shop-save-and-add-item'
      - assertVisible:
          id: 'shop-save-for-now'
      - assertNotVisible:
          id: 'shop-save'
- runFlow:
    when:
      true: ${HAS_LISTINGS === 'true'}
    commands:
      - assertVisible:
          id: 'shop-save'
      - assertNotVisible:
          id: 'shop-save-and-add-item'
      - assertNotVisible:
          id: 'shop-save-for-now'
- tapOn:
    id: 'shop-settings-back'
- extendedWaitUntil:
    visible:
      id: 'my-shop-screen'
    timeout: 10000
