appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Add Hot Wallet Test
---
# Imports a hot wallet via mnemonic seed phrase.
# Pre-requisite: Developer mode must be enabled (Advanced → Experimental features → Show experimental features, a.k.a. Secret Mode).
# Run: source .env && maestro test -e MAESTRO_MNEMONIC="$MAESTRO_MNEMONIC1" -e WALLET_NAME="Hot Wallet 1" .maestro/wallets/flow-110-add-hot-wallet.yaml

# Wait for app to be ready
- extendedWaitUntil:
    visible:
      id: 'tab-wallets'
    timeout: 40000

# Ensure we're on Home
- tapOn:
    id: 'tab-wallets'
- waitForAnimationToEnd:
    timeout: 3000

# Open Add Wallet using the strip or element-scoped carousel flicks.
- runFlow: ../common/open-add-wallet.yaml

- scrollUntilVisible:
    element: { id: 'wallet-type-mnemonic' }
    direction: DOWN
    timeout: 10000

# Select "Import Seed Phrase (Beta)" — requires dev mode enabled
- tapOn:
    id: 'wallet-type-mnemonic'
- waitForAnimationToEnd:
    timeout: 2000

# Retry the exact reporting phrase if Android drops a character.
- repeat:
    times: 3
    while:
      notVisible:
        id: 'mnemonic-input'
        text: ${MAESTRO_MNEMONIC.trim().split(/\s+/).join('\\s+')}
    commands:
      - tapOn:
          id: 'mnemonic-input'
      - tapOn:
          id: 'mnemonic-input'
      # A second tap can leave the cursor in the middle of a multiline phrase.
      # Select the whole value before deleting; the menu is absent on an empty field.
      - longPressOn: { id: 'mnemonic-input' }
      - tapOn: { text: '(?i)select all', optional: true }
      - eraseText:
          charactersToErase: 500
      # Separate words with an explicit Enter key. The app normalizes newlines to
      # spaces; this avoids Android dropping a space inside an inputText chunk.
      - evalScript: ${output.mnemonicWordIndex = 0}
      - repeat:
          while:
            true: ${output.mnemonicWordIndex < MAESTRO_MNEMONIC.trim().split(/\s+/).length}
          commands:
            - runFlow:
                file: ../common/type-text-in-chunks.yaml
                env:
                  TEXT_TO_TYPE: ${MAESTRO_MNEMONIC.trim().split(/\s+/)[output.mnemonicWordIndex]}
            - runFlow:
                when:
                  true: ${output.mnemonicWordIndex + 1 < MAESTRO_MNEMONIC.trim().split(/\s+/).length}
                commands:
                  - pressKey: ENTER
            - evalScript: ${output.mnemonicWordIndex = output.mnemonicWordIndex + 1}
- assertVisible:
    id: 'mnemonic-input'
    text: ${MAESTRO_MNEMONIC.trim().split(/\s+/).join('\\s+')}
- pressKey: back
- waitForAnimationToEnd:
    timeout: 1000

# Newline-separated input can make this step taller on smaller displays.
- scrollUntilVisible:
    element: { id: 'wizard-mnemonic-next' }
    direction: DOWN
    timeout: 10000
- tapOn: { id: 'wizard-mnemonic-next' }
- extendedWaitUntil:
    visible: { id: 'wallet-alias-input' }
    timeout: 10000

# Retry short name entry if Android drops a character or a space.
- repeat:
    times: 3
    while:
      notVisible:
        id: 'wallet-alias-input'
        text: ${WALLET_NAME}
    commands:
      - tapOn: { id: 'wallet-alias-input' }
      - tapOn: { id: 'wallet-alias-input' }
      - eraseText: 100
      - runFlow:
          file: ../common/type-text-in-chunks.yaml
          env:
            TEXT_TO_TYPE: ${WALLET_NAME}
- assertVisible:
    id: 'wallet-alias-input'
    text: ${WALLET_NAME}
- pressKey: back
- waitForAnimationToEnd:
    timeout: 1000

# Tap Next to theme step
- tapOn: { id: 'wizard-alias-next' }
- waitForAnimationToEnd:
    timeout: 2000

# Reveal Add Wallet without screen-size-dependent gestures.
- scrollUntilVisible:
    element: { id: 'wizard-connect-button' }
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'wizard-connect-button'
- waitForAnimationToEnd:
    timeout: 15000

# Verify the wallet was added and shows Connected
- extendedWaitUntil:
    visible:
      text: 'Connected'
    timeout: 30000

# Verify the wallet alias appears
- assertVisible:
    text: ${WALLET_NAME}
