appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Add On-chain Wallet Test
---
# Tests importing an on-chain Bitcoin wallet via xpub/zpub
# Run: source .env && maestro test -e MAESTRO_XPUB="$MAESTRO_XPUB1" -e WALLET_NAME="Watch Wallet 1" .maestro/wallets/flow-114-add-onchain-wallet.yaml

# Wait for app to be ready
- extendedWaitUntil:
    visible:
      id: 'tab-wallets'
    timeout: 40000

# Ensure we're on Home
- tapOn:
    id: 'tab-wallets'
- waitForAnimationToEnd:
    timeout: 3000

# Open Add Wallet using the strip or element-scoped carousel flicks.
- runFlow: ../common/open-add-wallet.yaml

- scrollUntilVisible:
    element: { id: 'wallet-type-onchain' }
    direction: DOWN
    timeout: 10000

# Select Bitcoin (On-chain) wallet type
- tapOn:
    id: 'wallet-type-onchain'
- waitForAnimationToEnd:
    timeout: 2000

# Verify exact public-key entry and retry if Android drops a character.
- repeat:
    times: 3
    while:
      notVisible:
        id: 'xpub-input'
        text: ${MAESTRO_XPUB}
    commands:
      - tapOn: { id: 'xpub-input' }
      - tapOn: { id: 'xpub-input' }
      - eraseText: 500
      - runFlow:
          file: ../common/type-text-in-chunks.yaml
          env:
            TEXT_TO_TYPE: ${MAESTRO_XPUB}
- assertVisible:
    id: 'xpub-input'
    text: ${MAESTRO_XPUB}
- pressKey: back
- waitForAnimationToEnd:
    timeout: 1000

# Tap Next to proceed to alias step
- tapOn:
    text: 'Next'
- waitForAnimationToEnd:
    timeout: 2000

# Retry short name entry if Android drops a character or a space.
- repeat:
    times: 3
    while:
      notVisible:
        id: 'wallet-alias-input'
        text: ${WALLET_NAME}
    commands:
      - tapOn: { id: 'wallet-alias-input' }
      - tapOn: { id: 'wallet-alias-input' }
      - eraseText: 100
      - runFlow:
          file: ../common/type-text-in-chunks.yaml
          env:
            TEXT_TO_TYPE: ${WALLET_NAME}
- assertVisible:
    id: 'wallet-alias-input'
    text: ${WALLET_NAME}
- pressKey: back
- waitForAnimationToEnd:
    timeout: 1000

# Tap Next to proceed to theme step
- tapOn:
    text: 'Next'
- waitForAnimationToEnd:
    timeout: 2000

# Reveal Add Wallet without screen-size-dependent gestures.
- scrollUntilVisible:
    element: { id: 'wizard-connect-button' }
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'wizard-connect-button'
- waitForAnimationToEnd:
    timeout: 10000

# Reuse the same reporting fixture when a previous setup already imported it.
- runFlow:
    when:
      visible: 'This wallet has already been imported'
    commands:
      - swipe:
          from: { text: 'Bottom sheet handle' }
          direction: DOWN
          duration: 200
      - extendedWaitUntil:
          notVisible: { id: 'wizard-connect-button' }
          timeout: 5000
      - tapOn: { text: '${WALLET_NAME}' }

# A background card must not hide a failed import behind the wizard.
- extendedWaitUntil:
    notVisible: { id: 'wizard-connect-button' }
    timeout: 60000

# Verify the on-chain wallet card is visible
- extendedWaitUntil:
    visible:
      id: 'wallet-card-onchain'
    timeout: 30000

# Verify the wallet alias appears
- assertVisible:
    text: ${WALLET_NAME}
