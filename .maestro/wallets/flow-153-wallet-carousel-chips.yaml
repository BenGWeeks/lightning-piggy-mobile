appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Wallet strip jumps to the third wallet
---
# Requires at least four wallets. Check both the card and strip selection.
- tapOn: { id: 'tab-wallets' }
- runFlow:
    file: ../common/scroll-wallet-strip.yaml
    env:
      CHIP_ID: wallet-chip-0
      STRIP_DIRECTION: RIGHT
- tapOn: { id: 'wallet-chip-0' }
- extendedWaitUntil:
    visible: { id: 'wallet-carousel-page-0', selected: true }
    timeout: 5000
- runFlow:
    file: ../common/scroll-wallet-strip.yaml
    env:
      CHIP_ID: wallet-chip-2
      STRIP_DIRECTION: LEFT
- tapOn: { id: 'wallet-chip-2' }
- extendedWaitUntil:
    visible: { id: 'wallet-carousel-page-2', selected: true }
    timeout: 5000
- assertVisible: { id: 'wallet-chip-2', selected: true }
- assertNotVisible: { id: 'wallet-chip-0', selected: true }
# Jump back across intermediate cards: selection must stay on the destination.
- runFlow:
    file: ../common/scroll-wallet-strip.yaml
    env:
      CHIP_ID: wallet-chip-0
      STRIP_DIRECTION: RIGHT
- tapOn: { id: 'wallet-chip-0' }
- extendedWaitUntil:
    visible: { id: 'wallet-carousel-page-0', selected: true }
    timeout: 5000
- assertVisible: { id: 'wallet-chip-0', selected: true }
