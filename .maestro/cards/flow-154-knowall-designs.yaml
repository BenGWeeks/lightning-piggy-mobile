appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Select Sallie and Poppie wallet designs
---
# Requires an existing test wallet. Exercises the shared settings picker and
# verifies the persisted design on the full wallet card after each Save.
- extendedWaitUntil:
    visible:
      id: 'tab-wallets'
    timeout: 60000
- tapOn:
    id: 'tab-wallets'
- extendedWaitUntil:
    visible:
      id: 'wallet-settings'
    timeout: 15000
- tapOn:
    id: 'wallet-settings'
- tapOn:
    id: 'wallet-settings-tab-design'
- repeat:
    while:
      notVisible:
        text: 'Selected card theme: Sallie'
    times: 30
    commands:
      - swipe:
          from:
            id: 'wallet-card-picker-coverflow'
          direction: LEFT
          duration: 400
- assertVisible:
    id: 'theme-sallie'
- extendedWaitUntil:
    visible:
      text: 'Selected card theme: Sallie'
    timeout: 10000
- tapOn:
    id: 'wallet-settings-save'
- extendedWaitUntil:
    visible:
      id: 'wallet-card-design-sallie'
    timeout: 10000
- tapOn:
    id: 'wallet-settings'
- tapOn:
    id: 'wallet-settings-tab-design'
- repeat:
    while:
      notVisible:
        text: 'Selected card theme: Poppie'
    times: 30
    commands:
      - swipe:
          from:
            id: 'wallet-card-picker-coverflow'
          direction: RIGHT
          duration: 400
- assertVisible:
    id: 'theme-poppie'
- extendedWaitUntil:
    visible:
      text: 'Selected card theme: Poppie'
    timeout: 10000
- tapOn:
    id: 'wallet-settings-save'
- extendedWaitUntil:
    visible:
      id: 'wallet-card-design-poppie'
    timeout: 10000
