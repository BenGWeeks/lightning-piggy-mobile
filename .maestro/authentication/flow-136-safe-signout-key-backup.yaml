appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Safe sign-out — warning dialog + Back up your key screen (#1223)
tags:
  - authentication
---
# Non-destructive: NEVER confirms the sign-out and NEVER reveals the key.
#
# Precondition: the active account is a local-key (nsec) account that has
# not been marked backed up — e.g. Big Piggy after `common/login-nsec-big`.
#
# Covers:
#   1. Drawer → Sign Out shows the named, signer-aware dialog with
#      Back Up Key First / Sign Out Anyway / Cancel; Cancel keeps the account.
#   2. Back Up Key First opens the backup screen with the key masked, the
#      eye toggle, Copy, and "I've saved it" disabled until unlocked.
#   3. Settings → Security → Back up your key reaches the same screen.
#
# Run: maestro test .maestro/authentication/flow-136-safe-signout-key-backup.yaml

# --- 1. Sign-out dialog, cancelled ---------------------------------------
- runFlow: ../common/open-drawer.yaml
- scrollUntilVisible:
    element:
      id: 'drawer-sign-out'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'drawer-sign-out'
- extendedWaitUntil:
    visible:
      id: 'branded-alert'
    timeout: 5000
- assertVisible:
    text: 'Sign out of .*\?'
- assertVisible:
    id: 'sign-out-backup-first'
- assertVisible:
    id: 'sign-out-confirm'
- assertVisible:
    text: 'Sign Out Anyway'
- tapOn:
    id: 'sign-out-cancel'
- extendedWaitUntil:
    notVisible:
      id: 'branded-alert'
    timeout: 5000
# Still signed in: the drawer header still has the npub QR button.
- assertVisible:
    id: 'drawer-npub-qr'

# --- 2. Back Up Key First → backup screen ---------------------------------
- tapOn:
    id: 'drawer-sign-out'
- extendedWaitUntil:
    visible:
      id: 'sign-out-backup-first'
    timeout: 5000
- tapOn:
    id: 'sign-out-backup-first'
- extendedWaitUntil:
    visible:
      id: 'key-backup-reveal-toggle'
    timeout: 10000
- assertVisible:
    id: 'key-backup-status'
- assertVisible:
    text: 'Not backed up yet'
# Masked by default — the key text is the dot mask, not an nsec.
- assertVisible:
    id: 'key-backup-key-text'
    text: '•+'
- assertNotVisible:
    text: 'nsec1.*'
- assertVisible:
    id: 'key-backup-copy'
- assertVisible:
    id: 'key-backup-confirm-saved'
    enabled: false
- tapOn:
    id: 'account-back-button'
- waitForAnimationToEnd:
    timeout: 2000

# --- 3. Settings → Security entry point -----------------------------------
- runFlow: ../common/open-drawer.yaml
- scrollUntilVisible:
    element:
      id: 'drawer-row-security'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'drawer-row-security'
- extendedWaitUntil:
    visible:
      id: 'security-key-backup'
    timeout: 10000
- tapOn:
    id: 'security-key-backup'
- extendedWaitUntil:
    visible:
      id: 'key-backup-reveal-toggle'
    timeout: 10000
- assertNotVisible:
    text: 'nsec1.*'
- tapOn:
    id: 'account-back-button'
