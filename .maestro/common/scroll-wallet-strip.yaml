appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Internal — reveal a wallet chip within its strip
---
# Screen-centred scrollUntilVisible misses this small horizontal list.
- repeat:
    times: 20
    while:
      notVisible: { id: '${CHIP_ID}' }
    commands:
      - runFlow:
          when:
            true: ${STRIP_DIRECTION === 'LEFT'}
          commands:
            - swipe:
                from: { id: 'wallet-strip' }
                direction: LEFT
                duration: 300
      - runFlow:
          when:
            true: ${STRIP_DIRECTION === 'RIGHT'}
          commands:
            - swipe:
                from: { id: 'wallet-strip' }
                direction: RIGHT
                duration: 300
      - waitForAnimationToEnd: { timeout: 1000 }
- assertVisible: { id: '${CHIP_ID}' }
