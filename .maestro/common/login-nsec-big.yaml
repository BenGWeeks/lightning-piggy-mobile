appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Internal — make Big Piggy the active identity (nsec signer)
---
# Building block. Reads MAESTRO_NSEC_BIG from the environment — run with
# `set -a; source .env; set +a` first (Maestro picks up MAESTRO_* vars itself,
# so the nsec never goes on the command line).
- runFlow:
    file: login-nsec.yaml
    env:
      PIGGY_NSEC: ${MAESTRO_NSEC_BIG}
      PIGGY_PREFIX: 'ccedbff9'
      PIGGY_NPUB: 'npub1enkml7d…65f4st'
      PIGGY_NAME: 'Big Piggy'
