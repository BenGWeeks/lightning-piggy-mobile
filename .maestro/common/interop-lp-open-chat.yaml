appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
---
# Building block (never run alone) for .maestro/interop/: open one Lightning
# Piggy chat by its exact Messages-row testID, ${ROW_ID} — e.g.
# `group-row-marmot:<group id>` for the run's fresh group, or
# `conversation-row-<middle hex>:marmot` for the Marmot 1:1. The runner passes
# the id of a group it just created, so this can never open a real chat.
- launchApp:
    clearState: false
# Wait for the bundle to load (a dev client can take a while), then leave any
# restored chat with the app's own back button — never a blind system Back,
# which exits the app if it's still on the loading screen.
- extendedWaitUntil:
    visible:
      id: '(tab-messages|conversation-back|group-back)'
    timeout: 120000
- runFlow:
    when:
      visible:
        id: 'group-back'
    commands:
      - tapOn:
          id: 'group-back'
- runFlow:
    when:
      visible:
        id: 'conversation-back'
    commands:
      - tapOn:
          id: 'conversation-back'
- extendedWaitUntil:
    visible:
      id: 'tab-messages'
    timeout: 15000
- tapOn:
    id: 'tab-messages'
# The Messages list keeps its scroll position and new chats sort to the top:
# look upwards first, then downwards.
- scrollUntilVisible:
    element:
      id: '${ROW_ID}'
    direction: UP
    timeout: 20000
    visibilityPercentage: 50
    optional: true
- scrollUntilVisible:
    element:
      id: '${ROW_ID}'
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
- tapOn:
    id: '${ROW_ID}'
- extendedWaitUntil:
    visible:
      id: '(group-message-input|conversation-input)'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
