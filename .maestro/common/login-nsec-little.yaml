appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Internal — make Little Piggy the active identity (nsec signer)
---
# Building block. Reads MAESTRO_NSEC_LITTLE from the environment — Maestro picks up
# MAESTRO_* variables itself, so the nsec never goes on the command line.
# scripts/signer-matrix-e2e.sh exports only the three Piggy nsecs.
- runFlow:
    file: login-nsec.yaml
    env:
      PIGGY_NSEC: ${MAESTRO_NSEC_LITTLE}
      PIGGY_PREFIX: 'd9b33280'
      PIGGY_NPUB: 'npub1mxen9q9…tqp265'
      PIGGY_NAME: 'Little Piggy'
