appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Notifications sub-pages — view only
---
# Open pages and information sheets without changing any preferences.
- tapOn: { id: tab-wallets }
- tapOn: { id: profile-icon }
- scrollUntilVisible:
    element: { id: drawer-row-notifications }
    direction: DOWN
- tapOn: { id: drawer-row-notifications }
- extendedWaitUntil:
    visible: { id: security-marmot-push-toggle }
    timeout: 30000
- tapOn: { id: security-marmot-push-details }
- extendedWaitUntil:
    visible: { id: security-marmot-push-details-sheet }
    timeout: 10000
- tapOn: { id: security-marmot-push-details-sheet-close }
- scrollUntilVisible:
    element: { id: notifications-shop-alerts }
    direction: DOWN
- tapOn: { id: notifications-shop-alerts }
- extendedWaitUntil:
    visible: { id: settings-nearby-merchants-toggle }
    timeout: 15000
- assertVisible: { id: settings-alert-radius-250 }
- assertVisible: { id: settings-quiet-hours-toggle }
- tapOn: { id: shop-alerts-privacy }
- extendedWaitUntil:
    visible: { id: shop-alerts-privacy-sheet }
    timeout: 10000
- tapOn: { id: shop-alerts-privacy-sheet-close }
- tapOn: { id: account-back-button }
- scrollUntilVisible:
    element: { id: notifications-notification-server }
    direction: DOWN
- tapOn: { id: notifications-notification-server }
- extendedWaitUntil:
    visible: { id: security-marmot-push-server-current }
    timeout: 15000
- runFlow:
    when:
      notVisible: { id: security-marmot-push-server-input }
    commands:
      - tapOn: { id: security-marmot-push-advanced }
- extendedWaitUntil:
    visible: { id: security-marmot-push-server-input }
    timeout: 10000
- assertVisible: "Only a server holding Lightning Piggy's Apple/Google push credentials can deliver to this app."
- tapOn: { id: account-back-button }
- scrollUntilVisible:
    element: { id: notifications-muted-accounts }
    direction: UP
- tapOn: { id: notifications-muted-accounts }
- extendedWaitUntil:
    visible: { id: muted-accounts-list }
    timeout: 15000
- tapOn: { id: account-back-button }
- scrollUntilVisible:
    element: { id: account-back-button }
    direction: UP
- tapOn: { id: account-back-button }
- assertVisible: { id: tab-wallets }
