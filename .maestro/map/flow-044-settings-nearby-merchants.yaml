appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Alerts near Bitcoin shops — toggle, radius preset, quiet hours
---
# Walks through the "Alerts near Bitcoin shops" settings (the geofence half
# of #467), which live under Settings → Notifications → On this phone
# (#1222). Verifies that the screen renders, the radius
# preset chips switch (visual selection), and the quiet-hours toggle
# flips. The actual permission grant + geofence-task registration are
# not stable enough to assert under Maestro (they depend on whether the
# emulator has Google Play Services + a configured location), so the
# permission flow is left to manual smoke test in milestone 8.
#
# Run: maestro test .maestro/map/flow-044-settings-nearby-merchants.yaml

- waitForAnimationToEnd:
    timeout: 10000

# Open the account drawer via the Home tab's avatar header. The drawer
# has a `drawer-row-notifications` row that takes us into the screen.
- tapOn:
    id: 'tab-home'
- waitForAnimationToEnd:
    timeout: 1500

# Open the drawer by its stable accessibility ID.
- extendedWaitUntil:
    visible:
      id: 'profile-icon'
    timeout: 30000
- tapOn:
    id: 'profile-icon'

- tapOn:
    id: 'drawer-row-notifications'
- waitForAnimationToEnd:
    timeout: 1500

# The shop alerts sit at the bottom of the "On this phone" half.
- scrollUntilVisible:
    element:
      id: 'settings-quiet-hours-toggle'
    direction: DOWN
    timeout: 15000
- assertVisible: 'Alerts near Bitcoin shops'
- assertVisible: 'Alert me near Bitcoin shops'
- assertVisible:
    id: 'settings-nearby-merchants-toggle'

# Tap a radius preset and check selection persists by re-reading the chip
# (the chip's text doesn't change but its accessibilityState does — we
# rely on visual + a follow-up assertion that the 250m chip is present).
- tapOn:
    id: 'settings-alert-radius-250'
- waitForAnimationToEnd:
    timeout: 600
- assertVisible:
    id: 'settings-alert-radius-250'

# Quiet hours toggle.
- tapOn:
    id: 'settings-quiet-hours-toggle'
- waitForAnimationToEnd:
    timeout: 600
- assertVisible:
    id: 'settings-quiet-hours-toggle'

# Back out of the drawer screen.
- scrollUntilVisible:
    element:
      id: 'account-back-button'
    direction: UP
    timeout: 15000
- tapOn:
    id: 'account-back-button'
- waitForAnimationToEnd:
    timeout: 1000
