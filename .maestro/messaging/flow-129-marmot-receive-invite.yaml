appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Marmot invite received — Middle Piggy starts an MLS DM, Big accepts it
---
# The inbound half: the peer bot, as Middle Piggy (`4b2fcb4e…`), creates a
# White Noise-shaped Marmot DM to Big Piggy, gift-wraps the kind-444 Welcome
# to Big's inbox and sends a message. Big (who follows Middle, so the
# follow gate passes) sees an "Invitation pending" row — every invite waits for
# consent, as in White Noise — accepts it, and gets the message in a Marmot
# thread, then replies over MLS.
#
# Prereqs: Big follows Middle; the bot is started with BOT_INITIATE_TO=<Big>.
# Run: bash scripts/marmot-e2e.sh 129

# No relaunch: the runner opens Messages BEFORE the bot sends its invite, so
# the Welcome gift wrap arrives on the live subscription (a relaunch after
# the wrap was published would rely on the randomised-timestamp backfill).
- launchApp:
    stopApp: false
- tapOn:
    id: 'tab-messages'
# Not joined until accepted: the invite waits above the inbox.
- scrollUntilVisible:
    element:
      text: 'Invitation pending'
    direction: UP
    timeout: 120000
# Middle's invitation only: an earlier run's invite may still be pending.
- tapOn:
    id: 'marmot-invite-accept-.*'
    childOf:
      id: 'marmot-invite-row-.*'
      containsDescendants:
        - text: 'Middle Piggy'
# Accepting a DM invite opens its Marmot thread.
- extendedWaitUntil:
    visible:
      text: 'hello Big from Middle over MLS.*'
    timeout: 30000
- assertVisible:
    text: 'Marmot'
- tapOn:
    id: 'conversation-input'
- inputText: 'got your invite ${RUN_TAG}'
- tapOn:
    id: 'conversation-send'
- extendedWaitUntil:
    visible:
      text: 'pong: .ot your invite ${RUN_TAG}'
    timeout: 120000
