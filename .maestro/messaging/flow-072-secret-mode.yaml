appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Enable Secret Mode Test
---
# Enables secret mode by triple-tapping the version number in the About
# account screen. Verifies the "Import Seed Phrase (Beta)" option then
# appears in the Add Wallet wizard.
# Run: maestro test .maestro/messaging/flow-072-secret-mode.yaml

# Launch without clearing data. Navigation is persisted across cold starts,
# so unwind a restored About/account screen before opening the drawer.
# Requires an onboarded profile with Home or an account screen restored.
- launchApp:
    stopApp: true
    clearState: false
- extendedWaitUntil:
    visible:
      id: 'tab-home|account-back-button'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        text: 'Bottom sheet handle'
    commands:
      - swipe:
          from:
            text: 'Bottom sheet handle'
          direction: DOWN
          duration: 300
- tapOn:
    id: 'account-back-button'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'tab-home'
    timeout: 40000
- tapOn:
    id: 'tab-home'
- tapOn:
    id: 'profile-icon'
- tapOn:
    id: 'drawer-row-about'
- extendedWaitUntil:
    visible:
      id: 'version-text'
    timeout: 10000

# Only enable; never toggle an already-enabled mode off. Consecutive ordinary
# tap commands can exceed the release build's 1-second triple-tap window.
- runFlow:
    when:
      notVisible:
        text: 'v.*secret.*'
    commands:
      - tapOn:
          id: 'version-text'
          repeat: 3
          delay: 100
      - extendedWaitUntil:
          visible:
            id: 'secret-mode-celebration-ok'
          timeout: 5000
      - tapOn:
          id: 'secret-mode-celebration-ok'
- assertVisible:
    text: 'v.*secret.*'
- takeScreenshot: secret-mode-enabled

# About has no tab bar. Use its own back control before selecting Home.
- tapOn:
    id: 'account-back-button'
- extendedWaitUntil:
    visible:
      id: 'tab-home'
    timeout: 10000
- tapOn:
    id: 'tab-home'

# Scroll from the wallet card itself, not the screen centre (which belongs
# to Home's transaction list). Bound recovery if the carousel changes.
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'add-wallet-card'
          commands:
            - swipe:
                from:
                  id: 'wallet-card-.*'
                direction: LEFT
                duration: 300
- tapOn:
    id: 'add-wallet-card'
- scrollUntilVisible:
    element:
      id: 'wallet-type-mnemonic'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: 'wallet-type-mnemonic'
- takeScreenshot: secret-mode-import-option

# Leave the next suite flow on Home, rather than inside the wizard/account.
- swipe:
    from:
      text: 'Bottom sheet handle'
    direction: DOWN
    duration: 300
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'tab-home'
    timeout: 10000
- assertNotVisible:
    text: 'Bottom sheet handle'
