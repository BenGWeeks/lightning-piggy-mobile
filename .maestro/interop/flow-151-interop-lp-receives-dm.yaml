appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Interop — Lightning Piggy renders replies, reactions, edits and deletes in a Marmot 1:1
---
# Lightning Piggy only has reactions and Reply in Marmot 1:1 chats (groups
# have none — #1328), so the runner also has the scripted sender open a
# White Noise-shaped Marmot DM with Big Piggy (no name, both admins) and send
# the interaction subset of the item set into it.
#
# Env: ROW_ID=conversation-row-<sender hex>:marmot, TAG=<run tag>.
- runFlow:
    file: ../common/interop-lp-open-chat.yaml
# Swipe back (finger down = older messages) until it shows, then assert.
- repeat:
    times: 12
    while:
      notVisible:
        text: 'IO${TAG} editme v2 edited'
    commands:
      - swipe:
          direction: DOWN
          duration: 500
- assertVisible:
    label: 'IO-CHECK dm.edit'
    text: 'IO${TAG} editme v2 edited'
    optional: true
# Missed: go back to the newest message so later checks start from there.
- runFlow:
    when:
      notVisible:
        text: 'IO${TAG} editme v2 edited'
    commands:
      - repeat:
          times: 12
          commands:
            - swipe:
                direction: UP
                duration: 300
- takeScreenshot: lp-dm-edit
# "Not shown" check: search the whole thread first, then assert absence,
# then return to the newest message.
- repeat:
    times: 12
    while:
      notVisible:
        text: 'IO${TAG} deleteme should disappear'
    commands:
      - swipe:
          direction: DOWN
          duration: 500
- assertNotVisible:
    label: 'IO-CHECK dm.delete'
    text: 'IO${TAG} deleteme should disappear'
    optional: true
- repeat:
    times: 12
    commands:
      - swipe:
          direction: UP
          duration: 300
# Swipe back (finger down = older messages) until it shows, then assert.
- repeat:
    times: 12
    while:
      notVisible:
        text: 'IO${TAG} reply: replying to plain'
    commands:
      - swipe:
          direction: DOWN
          duration: 500
- assertVisible:
    label: 'IO-CHECK dm.reply'
    text: 'IO${TAG} reply: replying to plain'
    optional: true
# Missed: go back to the newest message so later checks start from there.
- runFlow:
    when:
      notVisible:
        text: 'IO${TAG} reply: replying to plain'
    commands:
      - repeat:
          times: 12
          commands:
            - swipe:
                direction: UP
                duration: 300
- takeScreenshot: lp-dm-reply
# Swipe back (finger down = older messages) until it shows, then assert.
- repeat:
