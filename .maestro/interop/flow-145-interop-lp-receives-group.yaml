appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Interop — Lightning Piggy renders what the scripted Marmot sender sent (group)
---
# Run by scripts/interop/run.sh, which first has scripts/interop/marmot-sender.mjs
# (as a test Piggy, its own MLS device) create a fresh group "IO <tag>",
# invite Big Piggy's installs + Little Piggy's White Noise, and send the item
# set in scripts/interop/items.mjs. Expects Lightning Piggy signed in as Big.
#
# The thread is an inverted list: Maestro's `direction: DOWN` walks back to
# older messages here (UP would move towards the newest).
#
# Every check is `optional` and labelled `IO-CHECK <item>`: the runner reads
# COMPLETED / WARNED per label from Maestro's output to build the matrix, so
# one missing item doesn't hide the rest. Items are checked newest-first while
# walking back from the newest message.
#
# Env: ROW_ID=group-row-marmot:<group id>, TAG=<run tag>.
- runFlow:
    file: ../common/interop-lp-open-chat.yaml
- scrollUntilVisible:
    label: 'IO-CHECK contact'
    element:
      id: 'group-conversation-contact-.*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-contact
- scrollUntilVisible:
    label: 'IO-CHECK location'
    element:
      id: 'group-conversation-location-.*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-location
- scrollUntilVisible:
    label: 'IO-CHECK invoice'
    element:
      id: 'group-conversation-invoice-.*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-invoice
- scrollUntilVisible:
    label: 'IO-CHECK voice'
    element:
      id: 'group-conversation-voice-.*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-voice
- scrollUntilVisible:
    label: 'IO-CHECK image'
    element:
      id: 'group-conversation-image-.*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-image
- scrollUntilVisible:
    label: 'IO-CHECK edit'
    element:
      text: 'IO${TAG} editme v2 edited'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-edit
- assertNotVisible:
    label: 'IO-CHECK delete'
    text: 'IO${TAG} deleteme should disappear'
    optional: true
- assertNotVisible:
    label: 'IO-CHECK edit.no-v1'
    text: 'IO${TAG} editme v1'
    optional: true
- scrollUntilVisible:
    label: 'IO-CHECK reply'
    element:
      text: 'IO${TAG} reply: replying to plain'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-reply
- scrollUntilVisible:
    label: 'IO-CHECK reply.quote'
    element:
      id: 'group-conversation-quote-.*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-reply-quote
- scrollUntilVisible:
    label: 'IO-CHECK text.zw'
    element:
      text: '(?s)IO${TAG} zw: .*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-text-zw
- scrollUntilVisible:
    label: 'IO-CHECK text.word'
    element:
      text: '(?s)IO${TAG} word: .*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-text-word
- scrollUntilVisible:
    label: 'IO-CHECK text.long'
    element:
      text: '(?s)IO${TAG} long: .*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-text-long
- scrollUntilVisible:
    label: 'IO-CHECK text.html'
    element:
      text: '(?s)IO${TAG} html: .*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-text-html
- scrollUntilVisible:
    label: 'IO-CHECK text.js'
    element:
      text: '(?s)IO${TAG} js: .*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-text-js
- scrollUntilVisible:
    label: 'IO-CHECK text.json'
    element:
      text: '(?s)IO${TAG} json: .*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-text-json
- scrollUntilVisible:
    label: 'IO-CHECK text.md'
    element:
      text: '(?s)IO${TAG} md: .*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-text-md
- scrollUntilVisible:
    label: 'IO-CHECK text.emoji'
    element:
      text: 'IO${TAG} emoji: .*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-text-emoji
- assertNotVisible:
    label: 'IO-CHECK unreact'
    id: 'group-conversation-reaction-.*-👍'
    optional: true
- scrollUntilVisible:
    label: 'IO-CHECK text.zh'
    element:
      text: 'IO${TAG} zh: .*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-text-zh
- scrollUntilVisible:
    label: 'IO-CHECK react'
    element:
      id: 'group-conversation-reaction-.*-❤️'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-react
- scrollUntilVisible:
    label: 'IO-CHECK text.plain'
    element:
      text: 'IO${TAG} plain: .*'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 30
    optional: true
- takeScreenshot: lp-group-text-plain
