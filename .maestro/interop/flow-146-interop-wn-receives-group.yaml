# The voice bubble is short: a 500 ms swipe loop flings it past the screen
# between visibility checks. scrollUntilVisible steps and settles, and
# centerElement keeps it on screen for the assertion.
- scrollUntilVisible:
    element:
      text: '.*0.0[1-9].*'
    direction: UP
    timeout: 90000
    centerElement: true
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    label: 'IO-CHECK voice'
    text: '.*0.0[1-9].*'
    optional: true
# Missed: go back to the newest message so later checks start from there.
- runFlow:
    when:
      notVisible:
        text: '.*0.0[1-9].*'
    commands:
      - repeat:
          times: 12
          commands:
            - swipe:
                direction: UP
                duration: 300
- takeScreenshot: wn-group-voice
