appId: ${WN_APP_ID || 'dev.ipf.whitenoise.android'}
name: Interop — White Noise renders what the scripted Marmot sender sent (group)
---
# White Noise side of flow-145: same group, same items, asserted with text
# selectors (White Noise is a third-party app; no testIDs). White Noise must be
# signed in as Little Piggy — the runner checks the invite is visible.
#
# Fragility: these selectors depend on White Noise's English copy and
# rendering (2026.10.3). It renders Markdown and decodes HTML entities, so
# those items match on the marker only. The image matches on the filename
# White Noise exposes as its label; the voice note on its duration (the
# fixture is 2 s).
#
# Env: WN_CHAT="IO <tag>", TAG=<run tag>.
- runFlow:
    file: ../common/interop-wn-open-chat.yaml
# Swipe back (finger down = older messages) until it shows, then assert.
- repeat:
    times: 12
    while:
      notVisible:
        text: '(?s).*IO${TAG} contact.*'
    commands:
      - swipe:
          direction: DOWN
          duration: 500
- assertVisible:
    label: 'IO-CHECK contact'
    text: '(?s).*IO${TAG} contact.*'
    optional: true
# Missed: go back to the newest message so later checks start from there.
- runFlow:
    when:
      notVisible:
        text: '(?s).*IO${TAG} contact.*'
    commands:
      - repeat:
          times: 12
          commands:
            - swipe:
                direction: UP
                duration: 300
- takeScreenshot: wn-group-contact
