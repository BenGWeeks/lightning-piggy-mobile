appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Account Drawer Test
---
# Exercises the account drawer introduced in #100:
#   1. Tapping the top-right profile icon opens the drawer.
#   2. The drawer shows the version footer.
#   3. Each section row navigates to its screen and the back button
#      returns to the tabs.
#   4. Secret Mode is visible in Advanced and requires confirmation to enable.
# Run: maestro test .maestro/profile/flow-094-account-drawer.yaml

- waitForAnimationToEnd:
    timeout: 15000

# Start on Home
- tapOn:
    id: 'tab-home'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# --- 1. Profile icon opens the drawer ---
- tapOn:
    id: 'profile-icon'
- waitForAnimationToEnd:
    timeout: 3000

# Drawer shell is visible: display-name header + version footer.
- assertVisible:
    id: 'drawer-display-name'
- assertVisible:
    id: 'drawer-version'

# --- 2. Navigate to Wallets and back ---
- tapOn:
    id: 'drawer-row-wallets'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: 'Wallets'
- scrollUntilVisible:
    element:
      id: 'account-back-button'
    direction: UP
    timeout: 15000
- tapOn:
    id: 'account-back-button'
- waitForAnimationToEnd:
    timeout: 3000

# --- 3. Navigate to Display & language and back ---
- tapOn:
    id: 'profile-icon'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'drawer-row-display-language'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'display-language-currency-row'
# The currency picker is a sub-page: its back returns to Display & language.
- tapOn:
    id: 'display-language-currency-row'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'currency-search'
- scrollUntilVisible:
    element:
      id: 'account-back-button'
    direction: UP
    timeout: 15000
- tapOn:
    id: 'account-back-button'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'display-language-currency-row'
# Picking a currency also returns to Display & language. Tap the one that's
# already selected so the flow doesn't change the account's currency.
- tapOn:
    id: 'display-language-currency-row'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'currency-[A-Z]{3}'
    selected: true
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'display-language-currency-row'
- scrollUntilVisible:
    element:
      id: 'account-back-button'
    direction: UP
    timeout: 15000
- tapOn:
    id: 'account-back-button'
- waitForAnimationToEnd:
    timeout: 3000

# --- 4. Advanced: verify confirmation, cancellation and state restoration ---
- tapOn:
    id: 'profile-icon'
- tapOn:
    id: 'drawer-row-advanced'
- scrollUntilVisible:
    element:
      id: 'advanced-secret-mode-toggle'
    direction: DOWN
    timeout: 15000
# An initially enabled switch stays enabled. When off, verify cancel first,
# then enable and disable it so this flow leaves the preference unchanged.
- runFlow:
    when:
      visible:
        id: 'advanced-secret-mode-toggle'
        checked: false
    commands:
      - tapOn:
          id: 'advanced-secret-mode-toggle'
      - tapOn:
          id: 'branded-alert-button-0'
      - assertVisible:
          id: 'advanced-secret-mode-toggle'
          checked: false
      - tapOn:
          id: 'advanced-secret-mode-toggle'
      - tapOn:
          id: 'branded-alert-button-1'
      - assertVisible:
          id: 'advanced-secret-mode-toggle'
          checked: true
      - tapOn:
          id: 'advanced-secret-mode-toggle'
      - assertVisible:
          id: 'advanced-secret-mode-toggle'
          checked: false

# The phone-wide settings (Bitcoin network, notification server) sit under
# "On this phone", below the account half.
- scrollUntilVisible:
    element:
      id: 'notification-server-section'
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: 'advanced-bitcoin-network'

# --- 5. Back to Home ---
- scrollUntilVisible:
    element:
      id: 'account-back-button'
    direction: UP
    timeout: 15000
- tapOn:
    id: 'account-back-button'
- waitForAnimationToEnd:
    timeout: 3000
