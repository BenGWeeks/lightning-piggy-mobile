appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Account Drawer Test
---
# View only; allow cold development bundles to finish loading.
- runFlow: ../common/open-drawer.yaml
- extendedWaitUntil:
    visible:
      id: drawer-display-name
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: drawer-version
    timeout: 120000
- tapOn:
    id: drawer-row-wallets
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: wallets-summary-row
    timeout: 120000
- scrollUntilVisible:
    element:
      id: account-back-button
    direction: UP
    timeout: 15000
- tapOn:
    id: account-back-button
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: profile-icon
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      id: drawer-row-display-language
    direction: DOWN
    timeout: 10000
- tapOn:
    id: drawer-row-display-language
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: display-language-currency-row
    timeout: 120000
- tapOn:
    id: display-language-currency-row
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: currency-search
    timeout: 120000
- scrollUntilVisible:
    element:
      id: account-back-button
    direction: UP
    timeout: 15000
- tapOn:
    id: account-back-button
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: display-language-currency-row
    timeout: 120000
- scrollUntilVisible:
    element:
      id: account-back-button
    direction: UP
    timeout: 15000
- tapOn:
    id: account-back-button
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: profile-icon
- scrollUntilVisible:
    element:
      id: drawer-row-advanced
    direction: DOWN
    timeout: 10000
- tapOn:
    id: drawer-row-advanced
- scrollUntilVisible:
    element:
      id: advanced-experimental-features
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: advanced-experimental-features
    timeout: 120000
- scrollUntilVisible:
    element:
      id: advanced-bitcoin-network
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: advanced-bitcoin-network
    timeout: 120000
- scrollUntilVisible:
    element:
      id: account-back-button
    direction: UP
    timeout: 15000
- tapOn:
    id: account-back-button
- waitForAnimationToEnd:
    timeout: 3000
