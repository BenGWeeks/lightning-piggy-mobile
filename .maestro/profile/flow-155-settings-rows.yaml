appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Settings rows and sub-pages (view only)
---
# View only: open rows and info sheets; never change preferences.
- tapOn:
    id: profile-icon
- extendedWaitUntil:
    visible:
      id: drawer-row-advanced
    timeout: 120000
- tapOn:
    id: drawer-row-advanced
- extendedWaitUntil:
    visible:
      id: advanced-secret-mode-toggle
    timeout: 120000
- assertVisible:
    id: advanced-account
- assertNotVisible: Each account on this phone chooses its own.
- tapOn:
    id: advanced-account-info
- extendedWaitUntil:
    visible:
      id: advanced-account-info-sheet
    timeout: 120000
- assertVisible: Each account on this phone chooses its own.
- tapOn:
    id: advanced-account-info-sheet-close
- scrollUntilVisible:
    element:
      id: nostr-native-crypto-info
    direction: DOWN
- tapOn:
    id: nostr-native-crypto-info
- extendedWaitUntil:
    visible:
      id: nostr-native-crypto-active
    timeout: 120000
- tapOn:
    id: nostr-native-crypto-info-sheet-close
- scrollUntilVisible:
    element:
      id: advanced-bubble-style-row
    direction: DOWN
- runFlow:
    when:
      visible:
        id: advanced-bubble-style-row
    commands:
      - tapOn:
          id: advanced-bubble-style-row
      - extendedWaitUntil:
          visible:
            id: advanced-bubble-style-A
          timeout: 120000
      - assertVisible:
          id: advanced-bubble-style-B
      - assertVisible:
          id: advanced-bubble-style-C
      - back
      - extendedWaitUntil:
          visible:
            id: advanced-bubble-style-row
          timeout: 120000
- runFlow:
    when:
      visible:
        id: advanced-profiler
    commands:
      - tapOn:
          id: advanced-profiler
      - extendedWaitUntil:
          visible:
            id: hermes-profiler-start
          timeout: 120000
      - tapOn:
          id: account-back-button
      - extendedWaitUntil:
          visible:
            id: advanced-profiler
          timeout: 120000
- scrollUntilVisible:
    element:
      id: account-back-button
    direction: UP
- tapOn:
    id: account-back-button
- extendedWaitUntil:
    visible:
      id: profile-icon
    timeout: 120000
- tapOn:
    id: profile-icon
