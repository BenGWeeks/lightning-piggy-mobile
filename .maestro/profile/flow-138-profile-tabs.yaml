appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Profile tabs — Posts (+ replies filter), Media, Shop + bio mention chip (#1332)
---
# Read-only: opens RobotechyShop's public profile (a real seller with Market
# listings and picture posts) through the nostr: deep link and walks the
# three tabs. No follow, zap or message — nothing is published.
# Needs a signed-in account (any test Piggy) and network access to relays.

- openLink: 'nostr:npub1yy0nyk6nj6tg4sx8nd7q5qcdw6pqd5e2cc0e8u2rmcgjhpvm63hsk67xe5'
- extendedWaitUntil:
    visible: { id: 'profile-tab-posts' }
    timeout: 60000

# Bio: `@npub1…` renders as a tappable @Name chip, not raw bech32.
- assertVisible: { id: 'nostr-mention-.*' }

# Posts: kind-1 notes.
- extendedWaitUntil:
    visible: { id: 'contact-profile-note-card-.*' }
    timeout: 30000

# Posts filter: top-level posts by default; "Posts & replies" adds replies,
# each with a "Replying to @Name" line (RobotechyShop's notes are mostly
# replies, so the context line shows up quickly).
- tapOn: { id: 'profile-posts-filter-replies' }
- extendedWaitUntil:
    visible: { id: 'profile-reply-context-.*' }
    timeout: 30000
- tapOn: { id: 'profile-posts-filter-posts' }

# Media: a grid of picture / video posts.
- tapOn: { id: 'profile-tab-media' }
- extendedWaitUntil:
    visible: { id: 'profile-media-tile-.*' }
    timeout: 30000

# Shop: the seller's verified NIP-99 listings, as Market cards.
- tapOn: { id: 'profile-tab-shop' }
- extendedWaitUntil:
    visible: { id: 'profile-shop-item-.*' }
    timeout: 45000

- tapOn: { id: 'profile-tab-posts' }
- tapOn: { id: 'contact-profile-back' }
